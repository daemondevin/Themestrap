        .ts-login-card { background:var(--ts-mb-panel);border:1px solid var(--ts-mb-border);border-radius:12px;padding:40px;width:100%;max-width:400px; }
        .ts-login-brand { display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ts-mb-accent);margin-bottom:28px; }
        .ts-login-title { font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--ts-mb-text-strong);margin:0 0 24px; }
        .ts-login-label { display:block;font-size:11px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--ts-mb-muted);margin-bottom:6px; }
        .ts-login-input,.ts-login-select { display:block;width:100%;height: 2.25rem;background:rgba(0,0,0,.25);border: 1px solid var(--bs-border-color, #495057);border-radius: 0.375rem;;color:var(--ts-mb-text);font-size:14px;padding: 2px 0.75rem;;margin-bottom:18px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;appearance:none; }
        .ts-login-input:hover,.ts-login-input:focus,.ts-login-select:focus { border-color:var(--ts-mb-accent); }
        .ts-login-input::placeholder { color:var(--ts-mb-muted); }
        .ts-login-hint { font-size:12px;color:var(--ts-mb-muted);margin-top:-12px;margin-bottom:18px; }
        .ts-login-hint a { color:var(--ts-mb-accent); }
        .ts-login-submit { display:block;width:100%;padding:11px;background:var(--ts-mb-accent);color:var(--ts-mb-text-strong);border:none;border-radius:0.375rem;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .14s; }
        .ts-login-submit:hover { opacity:.88; }
        .ts-login-submit:disabled { opacity:.6;cursor:default; }
        #login-msg { margin-top:14px;font-size:13px; }

        /* Remember me checkbox */
        .ts-login-remember { display:flex;align-items:center;gap:9px;margin-bottom:18px;cursor:pointer;user-select:none; }
        .ts-login-remember input[type="checkbox"] { position:absolute;opacity:0;width:0;height:0; }
        .ts-login-check-box {
            width:16px;height:16px;flex-shrink:0;
            border:1.5px solid rgba(255,255,255,.22);border-radius:3px;
            background:rgba(255,255,255,.04);
            display:flex;align-items:center;justify-content:center;
            transition:background .12s,border-color .12s;
        }
        .ts-login-remember input:checked ~ .ts-login-check-box {
            background:var(--ts-mb-accent);border-color:var(--ts-mb-accent);
        }
        .ts-login-remember input:checked ~ .ts-login-check-box::after {

            </div>
            <h1 class="ts-login-title">Sign in</h1>
            <label class="ts-login-label" for="provider">Provider</label>
            <div data-plugin-select style="margin-bottom: 20px;">
                <select name="provider" class="ts-login-select" id="provider">
                    <option value="">Pick a provider…</option>
                    <option value="gmail">Gmail</option>
                    <option value="outlook">Outlook / Hotmail</option>
                    <option value="yahoo">Yahoo</option>
                    <option value="icloud">iCloud</option>
                    <option value="protonmail">ProtonMail</option>
                    <option value="zoho">Zoho</option>
                </select>
            </div>
            <label class="ts-login-label" for="email">Email address</label>
            <input type="email" id="email" class="ts-login-input" placeholder="you@example.com" autocomplete="email">
            <label class="ts-login-label" for="password">Password</label>
            <input type="password" id="password" class="ts-login-input" placeholder="••••••••" autocomplete="current-password">
            <p class="ts-login-hint">For Gmail, use an <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener">App Password</a></p>
            <label class="ts-login-remember">
                <input type="checkbox" id="remember-me" autocomplete="off">
                <span class="ts-login-check-box"></span>
                <span class="ts-login-check-label">Remember me</span>
            </label>
            <button class="ts-login-submit" id="btn-login" onclick="login()">
                <i class="fas fa-plug"></i> Connect
            </button>
            <div id="login-msg" role="alert" aria-live="polite"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/daemondevin/Themestrap@main/js/themestrap.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/daemondevin/Themestrap@main/js/components/themestrap.plugin.select.js"></script>
    <script>
    if (typeof themestrap.fn === 'object' && typeof themestrap.fn.intObsInit === 'function') {
        themestrap.fn.intObsInit('[data-plugin-select]:not(.manual)', 'themestrapPluginSelect');
    }
    
const RM_KEY = 'mb-remember';
const USER_KEY = 'mb-user-session';

function login() {
    const provider   = document.getElementById('provider').value;
    const email      = document.getElementById('email').value.trim();
    const password   = document.getElementById('password').value;
    const rememberMe = document.getElementById('remember-me').checked;

    if (!email || !password) { 
        showMsg('Please fill in all fields.', 'var(--ts-mb-danger)'); 
        return; 
    }

    const btnLogin = document.getElementById('btn-login');
    if (btnLogin) btnLogin.disabled = true;

    showMsg('<i class="fas fa-spinner fa-spin"></i> Connecting…', 'var(--ts-mb-accent)');

    // Simulate backend network delay (600ms)
    setTimeout(() => {
        // Handle Remember Me credentials
        if (rememberMe) {
            localStorage.setItem(RM_KEY, JSON.stringify({ provider, email }));
        } else {
            localStorage.removeItem(RM_KEY);
        }

        // Save active session details for app consumption
        localStorage.setItem(USER_KEY, JSON.stringify({
            email,
            provider,
            isLoggedIn: true,
            loginTime: new Date().toISOString()
        }));

        showMsg('<i class="fas fa-check"></i> Connected! Redirecting…', 'var(--ts-mb-accent)');

        // Redirect directly to inbox.html
        setTimeout(() => { 
            window.location.href = 'inbox.html'; 
        }, 800);
    }, 600);
}

function showMsg(html, color) {
    const el = document.getElementById('login-msg');
    if (!el) return;
    el.innerHTML   = html;
    el.style.color = color;
}

// Restore saved provider + email on page load
(function restoreSaved() {
    try {
        const saved = JSON.parse(localStorage.getItem(RM_KEY) || 'null');
        if (!saved) return;

        const providerEl = document.getElementById('provider');
        const emailEl    = document.getElementById('email');
        const rememberEl = document.getElementById('remember-me');
        const passEl     = document.getElementById('password');

        if (saved.provider && providerEl) providerEl.value = saved.provider;
        if (saved.email && emailEl)       emailEl.value    = saved.email;
        if (rememberEl)                   rememberEl.checked = true;

        // Move focus to the password field since email is already filled
        if (passEl) passEl.focus();
    } catch(e) {}
})();

// Allow submitting with Enter key on password input
const passInput = document.getElementById('password');
if (passInput) {
    passInput.addEventListener('keydown', e => { 
        if (e.key === 'Enter') login(); 
    });
}
    </script>
