
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5

      # The site pages go at the root. The demos load ../css, ../img, ../js and ../vendor,
      # so those folders sit beside demos/ exactly as they do in the repository.
      - name: Assemble the site
        run: |
          mkdir -p public
          cp -r _site/. public/
          cp -r demos css img js vendor public/
          rm -f public/README.md

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
