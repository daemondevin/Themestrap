<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo | Themestrap</title>
    <meta name="description" content="A live Themestrap component demo with links to its guide and source.">
    <meta name="theme-color" content="#0a1929">

    <!-- Apply the saved theme before any CSS paints (same key PluginDarkMode uses) -->
    <script>
        (function () {
            try {
                var s = localStorage.getItem('themestrap-theme'),
                    d = matchMedia('(prefers-color-scheme: dark)').matches,
                    t = s || (d ? 'dark' : 'light'),
                    h = document.documentElement;
                if (t === 'dark') h.classList.add('dark');
                h.setAttribute('data-theme', t);
                h.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>

    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:400,700&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/site.css">

    <script src="assets/js/manifest.js"></script>
</head>

    <div class="demo-bar">
        <div class="container-site demo-bar__inner">
            <div class="demo-bar__info">
                <ol class="doc-crumbs demo-bar__crumbs">
                    <li><a href="demos.html">Demos</a></li>

                        <i class="bi bi-chevron-left" aria-hidden="true"></i>
                        <span class="demo-bar__step-text"><span class="demo-bar__step-dir">Previous</span><span class="demo-bar__step-name" data-step-name></span></span>

    <!-- The demo runs in its own document, so its styles, scroll effects and scripts behave as they do standalone -->
    <main id="main" class="demo-stage" tabindex="-1">
        <iframe class="demo-stage__frame" data-demo-frame title="Live demo"></iframe>
        <div class="demo-stage__status" data-demo-status role="status">
            <span class="demo-stage__spinner" aria-hidden="true"></span>
            <span data-demo-status-text>Loading the demo</span>
        </div>
    </main>

    <!-- Command menu; site.js fills the groups from the manifest -->
    <div data-plugin-command-menu id="cmdk" data-plugin-options='{"shortcut": "mod+k", "recent": true}'>
        <div data-command-backdrop></div>
        <div data-command-panel>
            <div data-command-search>
                <i class="bi bi-search" aria-hidden="true"></i>
                <input data-command-input type="text" placeholder="Search components and guides" aria-label="Search components and guides">
            </div>
            <div data-command-list>
                <div data-command-empty>No results. Try a component name such as "select" or "drawer".</div>
                <div data-command-group data-command-heading="Recent" data-command-recent></div>
            </div>
            <div data-command-footer>
                <kbd>↑</kbd><kbd>↓</kbd> to move
                <kbd>↵</kbd> to open
                <kbd>esc</kbd> to close
            </div>
        </div>
    </div>

    <!-- Vendors -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/daemondevin/Themestrap@main/js/components/themestrap.plugin.darkmode.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/daemondevin/Themestrap@main/js/components/themestrap.plugin.toast.js"></script>

    <!-- Site behavior and the demo pages, then auto-init last -->
    <script src="assets/js/site.js"></script>

</body>
</html>
